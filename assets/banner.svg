<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <!--
    Zero-Two-STYLE header — ORIGINAL artwork (own work, no third-party asset).
    Character cues generic: long pink hair, two glowing red horns, white headband,
    teal eyes, dark pilot suit. Palette #FF2E63 / #08D9D6 / #0D0D0D.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="55%" stop-color="#1a0a14"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="hairBack" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#FF2E63"/><stop offset="100%" stop-color="#7d0c2b"/>
    </linearGradient>
    <linearGradient id="hairFront" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#F0679A"/><stop offset="45%" stop-color="#E62A5C"/>
      <stop offset="100%" stop-color="#c0144a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE3DC"/><stop offset="100%" stop-color="#EFC7BE"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22222b"/><stop offset="100%" stop-color="#111117"/>
    </linearGradient>
    <linearGradient id="suitShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a48" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E63"/><stop offset="100%" stop-color="#08D9D6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#FF2E63" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FF2E63" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="faceClip"><path d="M0 -40 C38 -40 58 -12 58 24 C58 62 33 92 0 92 C-33 92 -58 62 -58 24 C-58 -12 -38 -40 0 -40 Z"/></clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <g stroke="#FF2E63" stroke-opacity="0.055" stroke-width="1">
    <path d="M0 42H1200M0 84H1200M0 126H1200M0 168H1200M0 210H1200M0 252H1200M0 294H1200"/>
    <path d="M70 0V340M190 0V340M310 0V340M430 0V340M550 0V340M670 0V340M790 0V340M910 0V340M1030 0V340M1150 0V340"/>
  </g>

  <!-- floating code glyphs for tech vibe -->
  <g font-family="JetBrains Mono, monospace" font-size="13" fill="#08D9D6" opacity="0.16">
    <text x="40" y="70">&lt;/&gt;</text><text x="180" y="300">0x02</text>
    <text x="330" y="60">$ _</text><text x="1080" y="300">#!/bin/sh</text>
    <text x="1090" y="52">:8080</text>
  </g>

  <ellipse cx="900" cy="180" rx="330" ry="250" fill="url(#halo)"/>

  <!-- ================= FIGURE ================= -->
  <g transform="translate(895,52)">
    <!-- long back hair -->
    <path d="M-16 10 C-140 18 -205 130 -186 268 C-176 312 -140 330 -112 306
             C-126 232 -108 148 -66 104 C-44 80 -22 62 -16 10 Z" fill="url(#hairBack)"/>
    <path d="M16 10 C140 18 205 130 186 268 C176 312 140 330 112 306
             C126 232 108 148 66 104 C44 80 22 62 16 10 Z" fill="url(#hairBack)"/>
    <!-- hair glow accents -->
    <path d="M-150 250 C-160 200 -152 150 -120 118" stroke="#FF6FA5" stroke-width="2.5" fill="none" opacity="0.55"/>
    <path d="M150 250 C160 200 152 150 120 118" stroke="#FF6FA5" stroke-width="2.5" fill="none" opacity="0.55"/>

    <!-- depth: back-hair shadow under the head -->
    <path d="M-16 10 C-90 20 -130 92 -124 180 C-96 150 -60 120 -16 100 Z" fill="#4e081c" opacity="0.6"/>
    <path d="M16 10 C90 20 130 92 124 180 C96 150 60 120 16 100 Z" fill="#4e081c" opacity="0.6"/>
    <!-- neck + shoulders -->
    <path d="M-20 86 h40 v46 h-40 z" fill="#E9BDB3"/>
    <path d="M-96 132 C-70 116 -40 110 0 110 C40 110 70 116 96 132 L112 226 C60 250 -60 250 -112 226 Z" fill="url(#suit)"/>
    <!-- suit depth -->
    <path d="M-96 132 C-70 116 -40 110 0 110 C40 110 70 116 96 132 L112 226
             C60 250 -60 250 -112 226 Z" fill="url(#suitShade)" opacity="0.75"/>
    <!-- collar -->
    <path d="M-52 118 C-30 134 30 134 52 118 L64 152 C30 172 -30 172 -64 152 Z" fill="#1b1b22"/>
    <path d="M-16 130 h32 v48 h-32 z" fill="#FF2E63" opacity="0.9"/>
    <path d="M-16 130 h32 v12 h-32 z" fill="#08D9D6" opacity="0.85"/>
    <circle cx="0" cy="196" r="5" fill="#08D9D6" opacity="0.9"/>

    <!-- face -->
    <path d="M0 -40 C38 -40 58 -12 58 24 C58 62 33 92 0 92 C-33 92 -58 62 -58 24 C-58 -12 -38 -40 0 -40 Z" fill="url(#skin)"/>
    <!-- face depth: side shadow + chin shade -->
    <path d="M0 -40 C38 -40 58 -12 58 24 C58 62 33 92 0 92 C-22 92 -42 74 -52 44
             C-38 60 -20 66 0 66 C24 66 40 44 40 16 C40 -12 22 -34 0 -34 Z"
          fill="#D79C92" opacity="0.7"/>
    <path d="M-30 66 C-12 80 12 80 30 66 C18 84 -18 84 -30 66 Z" fill="#DDA093" opacity="0.4"/>
    <!-- cheek blush -->
    <ellipse cx="-34" cy="44" rx="11" ry="6" fill="#FF8FAE" opacity="0.5"/>
    <ellipse cx="34" cy="44" rx="11" ry="6" fill="#FF8FAE" opacity="0.5"/>
    <!-- eyes -->
    <g>
      <ellipse cx="-22" cy="26" rx="10.5" ry="13" fill="#0c3b3e"/>
      <ellipse cx="-22" cy="27" rx="9" ry="11" fill="#08D9D6"/>
      <ellipse cx="-22" cy="30" rx="6" ry="6.5" fill="#0b2a2c"/>
      <circle cx="-25" cy="22" r="3.4" fill="#EAEAEA"/>
      <ellipse cx="22" cy="26" rx="10.5" ry="13" fill="#0c3b3e"/>
      <ellipse cx="22" cy="27" rx="9" ry="11" fill="#08D9D6"/>
      <ellipse cx="22" cy="30" rx="6" ry="6.5" fill="#0b2a2c"/>
      <circle cx="19" cy="22" r="3.4" fill="#EAEAEA"/>
    </g>
    <!-- lashes + brows -->
    <path d="M-34 14 Q-22 6 -10 12" stroke="#B3123F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M10 12 Q22 6 34 14" stroke="#B3123F" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-32 20 Q-22 14 -13 18" stroke="#5c0a22" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M13 18 Q22 14 32 20" stroke="#5c0a22" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- nose + mouth -->
    <path d="M-2 44 q3 4 6 0" stroke="#D98A9B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-8 60 Q0 68 8 60" stroke="#C4637B" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- white headband -->
    <path d="M-60 2 C-34 -16 34 -16 60 2 L60 15 C34 -2 -34 -2 -60 15 Z" fill="#EAEAEA"/>
    <path d="M-60 12 C-34 -4 34 -4 60 12" stroke="#c9c9c9" stroke-width="1.4" fill="none"/>

    <!-- front hair / bangs -->
    <path d="M-62 6 C-72 -44 -38 -82 0 -82 C38 -82 72 -44 62 6
             C48 -22 30 -36 0 -36 C-30 -36 -48 -22 -62 6 Z" fill="url(#hairFront)"/>
    <path d="M-62 6 C-78 44 -84 96 -74 138 C-62 106 -58 64 -48 34 Z" fill="url(#hairFront)"/>
    <path d="M62 6 C78 44 84 96 74 138 C62 106 58 64 48 34 Z" fill="url(#hairFront)"/>
    <!-- hair highlights for form -->
    <path d="M-46 -40 C-56 -6 -58 40 -50 84" stroke="#FFB3CD" stroke-width="3.2" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M-30 -60 C-38 -26 -40 22 -34 60" stroke="#FFB3CD" stroke-width="2.2" fill="none" opacity="0.32" stroke-linecap="round"/>
    <path d="M46 -40 C56 -6 58 40 50 84" stroke="#FF85AE" stroke-width="2.6" fill="none" opacity="0.35" stroke-linecap="round"/>
    <!-- bangs strands -->
    <path d="M-30 -74 C-36 -46 -40 -20 -34 6" stroke="#B3123F" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M30 -74 C36 -46 40 -20 34 6" stroke="#B3123F" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- HORNS (rooted into the skull, behind bangs) -->
    <g filter="url(#glow2)">
      <path d="M-30 -56 C-60 -92 -82 -132 -76 -168 C-44 -146 -28 -110 -18 -74 Z" fill="#FF2E63"/>
      <path d="M30 -56 C60 -92 82 -132 76 -168 C44 -146 28 -110 18 -74 Z" fill="#FF2E63"/>
    </g>
    <path d="M-32 -70 C-52 -100 -66 -130 -66 -152" stroke="#7d0c2b" stroke-width="1.8" fill="none" opacity="0.75"/>
    <path d="M32 -70 C52 -100 66 -130 66 -152" stroke="#7d0c2b" stroke-width="1.8" fill="none" opacity="0.75"/>
    <path d="M-26 -66 C-38 -90 -46 -112 -46 -130" stroke="#FF85AE" stroke-width="1.2" fill="none" opacity="0.5"/>
    <path d="M26 -66 C38 -90 46 -112 46 -130" stroke="#FF85AE" stroke-width="1.2" fill="none" opacity="0.5"/>

    <!-- HORNS (high contrast: dark crimson + dark outline + rim light) -->
    <g>
      <!-- dark separation outline -->
      <path d="M-28 -60 C-56 -94 -76 -130 -70 -166 C-38 -146 -22 -108 -14 -74 Z"
            fill="#3d0512" stroke="#1a0208" stroke-width="2.5"/>
      <path d="M28 -60 C56 -94 76 -130 70 -166 C38 -146 22 -108 14 -74 Z"
            fill="#3d0512" stroke="#1a0208" stroke-width="2.5"/>
      <!-- crimson core -->
      <path d="M-26 -63 C-52 -95 -70 -128 -64 -160 C-36 -142 -21 -107 -14 -77 Z" fill="#E0114A"/>
      <path d="M26 -63 C52 -95 70 -128 64 -160 C36 -142 21 -107 14 -77 Z" fill="#E0114A"/>
      <!-- rim light (cyan, matches palette) -->
      <path d="M-26 -63 C-52 -95 -70 -128 -64 -160" stroke="#08D9D6" stroke-width="2.4" fill="none" opacity="0.85"/>
      <path d="M26 -63 C52 -95 70 -128 64 -160" stroke="#08D9D6" stroke-width="2.4" fill="none" opacity="0.85"/>
      <!-- inner ridges -->
      <path d="M-20 -74 C-34 -98 -46 -120 -46 -144" stroke="#7d0c2b" stroke-width="1.8" fill="none" opacity="0.9"/>
      <path d="M20 -74 C34 -98 46 -120 46 -144" stroke="#7d0c2b" stroke-width="1.8" fill="none" opacity="0.9"/>
      <!-- glow -->
      <path d="M-26 -63 C-52 -95 -70 -128 -64 -160 C-36 -142 -21 -107 -14 -77 Z" fill="#FF2E63" opacity="0.35" filter="url(#glow2)"/>
      <path d="M26 -63 C52 -95 70 -128 64 -160 C36 -142 21 -107 14 -77 Z" fill="#FF2E63" opacity="0.35" filter="url(#glow2)"/>
    </g>
  </g>

  <!-- ================= TEXT ================= -->
  <g font-family="JetBrains Mono, monospace">
    <text x="86" y="148" font-size="57" font-weight="800" fill="#EAEAEA" filter="url(#glow)">AAR SAPUTRA</text>
    <text x="88" y="190" font-size="18.5" fill="#08D9D6" letter-spacing="5.2">SECURITY · EXPLOIT DEV · TOOLING</text>
    <rect x="88" y="212" width="440" height="3" rx="1.5" fill="url(#neon)"/>
    <text x="88" y="256" font-size="15" fill="#FF2E63" opacity="0.92">⌁ 02 ⌁  darling in the terminal</text>
    <text x="88" y="286" font-size="12" fill="#7a5f6a">github.com/aarsaputra</text>
  </g>
</svg>
